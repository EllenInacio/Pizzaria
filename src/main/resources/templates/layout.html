<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pediu Patrão - Sistema de Pedidos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <!-- Token CSRF para as chamadas fetch às APIs -->
        <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
        <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN'">
        <script>
            // Cabeçalhos com o token CSRF (usar em todo fetch que altera dados)
            function csrfHeaders(extra) {
                const headers = Object.assign({}, extra || {});
                const token = document.querySelector('meta[name="_csrf"]').content;
                const header = document.querySelector('meta[name="_csrf_header"]').content;
                if (token) headers[header] = token;
                return headers;
            }

            // Mostra a mensagem de erro devolvida pela API ({"erro": "..."})
            async function mensagemErro(response) {
                if (response.status === 401) return 'Sessão expirada. Faça login novamente.';
                try {
                    const dados = await response.json();
                    if (dados && dados.erro) return dados.erro;
                } catch (e) { /* resposta sem JSON */ }
                if (response.status === 403) return 'Acesso negado: operação não permitida para o seu perfil.';
                return 'Erro ao processar a requisição (HTTP ' + response.status + ').';
            }
        </script>
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="container-fluid mt-4">
            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
